name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Fully automated npm publishing. Pushing a git tag like `v0.2.0` builds,
# tests, and publishes this package to npm under the @useauthio scope.
#
# Live browser-SDK conformance (authio_e2e-tests) cannot gate this workflow:
# authio_nextjs is public while authio_e2e-tests is private, and GitHub rejects
# reusable workflow calls across that visibility boundary. Conformance runs on
# authio_e2e-tests (schedule / main) instead.
#
# AUTH — org-level token:
# `NODE_AUTH_TOKEN` reads `secrets.NPM_TOKEN`, which is expected to be a
# single ORGANIZATION-level GitHub Actions secret shared by every
# authio-com repo (Settings → Secrets and variables → Actions → New
# organization secret). Missing release credentials fail the workflow.
#
# `--provenance` attaches a signed build-provenance attestation for
# supply-chain transparency (npm shows a verified "Built and signed on
# GitHub Actions" badge). It requires `id-token: write` (below) + a public
# repo.
#
# ALTERNATIVE — npm Trusted Publishing (OIDC, tokenless):
# npm supports keyless publishing via OIDC. To adopt it later, per package on
# npmjs.com go to Settings → Trusted Publisher → GitHub Actions and register
# repo `authio-com/<repo>` + workflow `publish.yml`. Then you can delete
# NPM_TOKEN and the env/gating and keep only `id-token: write` +
# `--provenance`. Until that's configured, the org-token path below is the
# active mechanism.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test (if a test script exists)
        run: |
          if node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('test')?0:1)"; then
            pnpm test
          else
            echo "no \"test\" script in package.json; skipping"
          fi
      # npm now refuses token publishes unless the token carries
      # bypass-2FA, which cannot be created while the account has 2FA
      # disabled — that policy is what broke every @useauthio release
      # after the NPM_TOKEN rotation on 2026-09-10. Trusted publishing
      # authenticates with the workflow's OIDC identity instead, so
      # there is no token to hold, rotate, or leak.
      #
      # Two things this needs, both of which the old step defeated:
      # npm skips OIDC entirely when NODE_AUTH_TOKEN is set, and OIDC
      # landed in npm 11.5.1 — newer than the npm bundled with Node 22,
      # and newer than pnpm's own support. So: no token in the env, and
      # publish with an explicitly upgraded npm rather than pnpm.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --provenance --access public
