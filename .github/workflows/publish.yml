name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Fully automated npm publishing. Pushing a git tag like `v0.2.0` builds,
# tests, and publishes this package to npm under the @useauthio scope.
#
# Live browser-SDK conformance (authio_e2e-tests) cannot gate this workflow:
# authio_nextjs is public while authio_e2e-tests is private, and GitHub rejects
# reusable workflow calls across that visibility boundary. Conformance runs on
# authio_e2e-tests (schedule / main) instead.
#
# AUTH — npm Trusted Publishing (OIDC, tokenless). No NPM_TOKEN, no OTP.
# On npmjs.com the package must list this workflow as a Trusted Publisher
# (Settings → Trusted Publisher → GitHub Actions):
#   Organization/user: Authio-com
#   Repository:        authio_nextjs
#   Workflow filename: publish.yml
#   Environment:       (blank)
#
# `--provenance` attaches a signed build-provenance attestation for
# supply-chain transparency (npm shows a verified "Built and signed on
# GitHub Actions" badge). It requires `id-token: write` (below) + a public
# repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # 22 to match ci.yml. The publish job was still on 20, which
          # npm 12 refuses to run on ("Required: node ^22.22.2 || ..."),
          # so the OIDC publish could not install a new enough npm.
          node-version: 22
          # Deliberately no registry-url. It makes setup-node write an
          # .npmrc (exported as NPM_CONFIG_USERCONFIG) containing
          # _authToken=${NODE_AUTH_TOKEN}. With no token set that
          # resolves to an empty credential, and npm sends it rather
          # than falling back to OIDC — which surfaces as a bare
          # 404 on PUT. Without the file, npm authenticates via the
          # workflow's OIDC identity as intended.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test (if a test script exists)
        run: |
          if node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('test')?0:1)"; then
            pnpm test
          else
            echo "no \"test\" script in package.json; skipping"
          fi
      # npm now refuses token publishes unless the token carries
      # bypass-2FA, which cannot be created while the account has 2FA
      # disabled — that policy is what broke every @useauthio release
      # after the NPM_TOKEN rotation on 2026-09-10. Trusted publishing
      # authenticates with the workflow's OIDC identity instead, so
      # there is no token to hold, rotate, or leak.
      #
      # Two things this needs, both of which the old step defeated:
      # npm skips OIDC entirely when NODE_AUTH_TOKEN is set, and OIDC
      # landed in npm 11.5.1 — newer than the npm bundled with Node 22,
      # and newer than pnpm's own support. So: no token in the env, and
      # publish with an explicitly upgraded npm rather than pnpm.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish was rejected. Confirm the package has a Trusted Publisher on npmjs.com: org Authio-com, repo authio_nextjs, workflow publish.yml, environment blank."
            exit 1
          fi
